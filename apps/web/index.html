<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>F5</title>
  </head>
  <body>
    <style>
      #boot-shell {
        position: fixed;
        inset: 0;
        overflow: auto;
        background: Canvas;
        color: CanvasText;
        z-index: 9999;
        font: 14px system-ui;
      }
      #boot-error {
        max-width: 540px;
        margin: 12vh auto;
        padding: 24px;
      }
      #boot-error h1 {
        font-size: 20px;
      }
      #boot-error button,
      #boot-error a {
        margin: 8px 8px 8px 0;
      }
      #boot-error button {
        padding: 8px 12px;
        cursor: pointer;
      }
      #boot-error pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 40vh;
        overflow: auto;
      }
      #boot-error summary {
        cursor: pointer;
        margin-top: 24px;
      }
    </style>
    <div id="boot-shell" aria-live="polite"></div>
    <div id="root"></div>
    <script type="module" src="/src/themeBoot.ts"></script>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
