name: Classify CI changes
description: Preserve docs-only and single-app exclusions without a queued prerequisite job
inputs:
  unaffected_by:
    description: >-
      App whose sources this job's checks never read: web (apps/web and apps/marketing)
      or server (apps/server). A pull request changing only that app skips the job.
      Empty or unknown values run the job for every code change. GitHub compares
      expression strings without regard to case, so `Web` means `web`.
    default: ""
outputs:
  heavy:
    description: Whether this job must execute its code checks
    value: ${{ steps.verdict.outputs.heavy }}
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: paths
      if: github.event_name == 'pull_request'
      with:
        predicate-quantifier: some-with-excludes
        filters: |
          code: ['**', '!**/*.md', '!docs/**']
          outside_web: ['**', '!**/*.md', '!docs/**', '!apps/web/**', '!apps/marketing/**']
          outside_server: ['**', '!**/*.md', '!docs/**', '!apps/server/**']
          server_read_by_web: ['apps/server/src/assetHttp.ts']
    # server_read_by_web lists every server source the web app imports (its browser
    # fixture serves the real asset headers); scripts/ci-change-scopes.test.ts keeps
    # the list complete. Evaluated in a step because the inputs context is only
    # guaranteed there. The job is skipped only for a known app whose filters found
    # nothing it reads. The filter reads the pull request files API, which stops at
    # 3,000 files; a pull request that large could hide a path outside the app, so
    # it runs every job.
    - id: verdict
      shell: bash
      env:
        HEAVY: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files >= 3000 || (steps.paths.outputs.code == 'true' && !((inputs.unaffected_by == 'web' && steps.paths.outputs.outside_web != 'true') || (inputs.unaffected_by == 'server' && steps.paths.outputs.outside_server != 'true' && steps.paths.outputs.server_read_by_web != 'true'))) }}
      run: echo "heavy=$HEAVY" >> "$GITHUB_OUTPUT"
