name: Set up F5
description: Install the pinned runtimes and frozen dependency tree
inputs:
  bun-version:
    description: Override the package-manager pin for a native release runner
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
        bun-version-file: ${{ inputs.bun-version == '' && 'package.json' || '' }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.bun/install/cache
          ~/.cache/electron
          ~/Library/Caches/electron
          ~/AppData/Local/electron/Cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    - name: Print toolchain versions
      shell: bash
      env:
        F5_CI_RUNNER_ARCH: ${{ runner.arch }}
        F5_CI_RUNNER_OS: ${{ runner.os }}
      run: |
        node --version
        bun --version
        git --version
        printf 'Runner: %s %s; image: %s %s\n' "$F5_CI_RUNNER_OS" "$F5_CI_RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
