name: Set up F5
description: Install the pinned runtimes and frozen dependency tree
inputs:
  cache-bun:
    description: Restore Bun packages (disable only for the hosted cache benchmark)
    default: "true"
  cache-layout:
    description: split for normal CI, combined only for the historical benchmark baseline
    default: split
  cache-suffix:
    description: Isolate benchmark cache keys; reuse a suffix to measure warm caches
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - name: Read Electron version
      id: electron
      shell: bash
      run: node -e 'const fs = require("node:fs"); const version = JSON.parse(fs.readFileSync("apps/desktop/package.json", "utf8")).dependencies.electron; fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + version + "\n");'
    - name: Restore historical combined cache
      if: inputs.cache-layout == 'combined'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.bun/install/cache
          ~/.cache/electron
          ~/Library/Caches/electron
          ~/AppData/Local/electron/Cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-suffix }}${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-suffix }}
    - name: Restore Bun packages
      if: inputs.cache-layout == 'split' && inputs.cache-bun == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-suffix }}${{ hashFiles('bun.lock') }}
        restore-keys: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-suffix }}
    - name: Restore Electron downloads
      if: inputs.cache-layout == 'split'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/electron
          ~/Library/Caches/electron
          ~/AppData/Local/electron/Cache
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}-${{ inputs.cache-suffix }}
    - name: Print toolchain versions
      shell: bash
      env:
        F5_CI_RUNNER_ARCH: ${{ runner.arch }}
        F5_CI_RUNNER_OS: ${{ runner.os }}
      run: |
        node --version
        bun --version
        git --version
        printf 'Runner: %s %s; image: %s %s\n' "$F5_CI_RUNNER_OS" "$F5_CI_RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
    - name: Verify Electron installation
      shell: bash
      working-directory: apps/desktop
      run: |
        node node_modules/electron/install.js
        node -e 'const fs = require("node:fs"); const { execFileSync } = require("node:child_process"); const resolved = execFileSync(process.execPath, ["-p", "require(\"electron\")"], { encoding: "utf8" }).trim(); if (!fs.existsSync(resolved)) throw new Error("Electron must resolve to an installed executable without download output");'
