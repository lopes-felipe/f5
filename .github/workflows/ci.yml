name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  VITEST_MAX_WORKERS: "2"
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ github.event_name != 'pull_request' || steps.paths.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: paths
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code: ['**', '!**/*.md', '!docs/**']
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        id: install
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run fmt:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run lint
      - name: Lint workflows
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          # Dependabot does not update this Docker image; update its digest deliberately.
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run typecheck
      - name: Boot server under Bun
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run test:bun-server-boot
      - name: Audit Claude SDK
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run sdk:audit
      - name: Audit Codex requests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run protocol:audit:requests:baseline
      - name: Audit Codex protocol
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run protocol:audit:baseline
      - name: Audit Muse protocol
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run protocol:audit:muse
      - name: Release smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run release:smoke
      - name: Check computer tier table drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/generate-computer-tiers.ts --check
      - name: Validate authoritative upstream port ledger
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_REQUIRE_UPSTREAM: "1"
        run: |
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/pingdotgg/t3code.git
          fi
          git remote set-url --push upstream DISABLED
          git fetch --no-prune --no-tags upstream refs/heads/main:refs/remotes/upstream/main
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # The full-history checkout already has the PR base; enforce immutability and ledger-only PRs.
            if ! git rev-parse --verify --quiet "refs/remotes/origin/${GITHUB_BASE_REF}" >/dev/null; then
              echo "::error::origin/${GITHUB_BASE_REF} is not in the checkout; the upstream ledger base-ref rules need it."
              exit 1
            fi
            export F5_LEDGER_BASE_REF="origin/${GITHUB_BASE_REF}"
          fi
          bun run upstream-ports:check
      - uses: ./.github/actions/assert-clean-worktree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: install
      - name: Set diagnostic paths
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          printf 'F5_CI_REPORT_DIR=%s/ci-reports/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'F5_CI_ARTIFACT_DIR=%s/ci-artifacts/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Prepare report directory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci-test-summary.ts --prepare
      - name: Workspace suites
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run test:ci:workspaces
      - name: Server Git smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "server-git-smoke"
        run: |
          bun run --cwd apps/server test:git:smoke
      - name: Server integration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "server-integration"
        run: |
          bun run --cwd apps/server test:integration
      - name: Server Git extended
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "server-git-extended"
        run: |
          bun run --cwd apps/server test:git:extended
      - name: Summarize test reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci-test-summary.ts test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ env.F5_CI_REPORT_DIR || format('{0}/ci-reports/{1}', runner.temp, github.job) }}
          retention-days: 7
          if-no-files-found: ignore
      - uses: ./.github/actions/assert-clean-worktree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
  server-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        shell: bash
    env:
      VITEST_MAX_WORKERS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: install
      - name: Set diagnostic paths
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          printf 'F5_CI_REPORT_DIR=%s/ci-reports/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'F5_CI_ARTIFACT_DIR=%s/ci-artifacts/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Prepare report directory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci-test-summary.ts --prepare
      - name: Server unit shard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "server-unit-${{ matrix.shard }}"
        run: |
          bun run test:server:shard --shard=${{ matrix.shard }}/2
      - name: Summarize test reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci-test-summary.ts server-unit-${{ matrix.shard }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ env.F5_CI_REPORT_DIR || format('{0}/ci-reports/{1}', runner.temp, github.job) }}
          retention-days: 7
          if-no-files-found: ignore
      - uses: ./.github/actions/assert-clean-worktree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
  windows-server-unit:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: install
      - name: Set diagnostic paths
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          printf 'F5_CI_REPORT_DIR=%s/ci-reports/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'F5_CI_ARTIFACT_DIR=%s/ci-artifacts/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Prepare report directory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci-test-summary.ts --prepare
      - name: Server unit shard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "server-unit-${{ matrix.shard }}"
          # Per-file storage accounting evidence for the Windows logical-byte gap.
        run: |
          bun run test:server:shard --shard=${{ matrix.shard }}/3
      - name: Summarize test reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci-test-summary.ts server-unit-${{ matrix.shard }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ env.F5_CI_REPORT_DIR || format('{0}/ci-reports/{1}', runner.temp, github.job) }}
          retention-days: 7
          if-no-files-found: ignore
      - uses: ./.github/actions/assert-clean-worktree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: install
      - name: Set diagnostic paths
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          printf 'F5_CI_REPORT_DIR=%s/ci-reports/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'F5_CI_ARTIFACT_DIR=%s/ci-artifacts/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Prepare report directory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci-test-summary.ts --prepare
      - name: Install Chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run --cwd apps/web test:browser:install
      - name: Browser tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "web-browser"
        run: |
          timeout --signal=TERM --kill-after=20s 8m bun run --cwd apps/web test:browser
      - name: Summarize test reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci-test-summary.ts browser
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ env.F5_CI_REPORT_DIR || format('{0}/ci-reports/{1}', runner.temp, github.job) }}
          retention-days: 7
          if-no-files-found: ignore
      - name: Stage browser diagnostics
        if: always()
        env:
          ARTIFACT_SOURCE: ${{ env.F5_CI_ARTIFACT_DIR || format('{0}/ci-artifacts/{1}', runner.temp, github.job) }}
          ARTIFACT_STAGING: ${{ runner.temp }}/ci-upload/browser
        run: |
          mkdir -p "$ARTIFACT_STAGING"
          if [[ -d "$ARTIFACT_SOURCE" ]]; then
            cp -R "$ARTIFACT_SOURCE/." "$ARTIFACT_STAGING/"
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-upload/browser
          retention-days: 7
          if-no-files-found: ignore
      - uses: ./.github/actions/assert-clean-worktree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: install
      - name: Set diagnostic paths
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          printf 'F5_CI_REPORT_DIR=%s/ci-reports/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'F5_CI_ARTIFACT_DIR=%s/ci-artifacts/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Prepare report directory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci-test-summary.ts --prepare
      - name: Configure Electron sandbox
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/desktop
        run: |
          electron_sandbox="$(node -e 'const path = require("node:path"); console.log(path.join(path.dirname(require("electron")), "chrome-sandbox"))')"
          sudo chown root:root "$electron_sandbox"
          sudo chmod 4755 "$electron_sandbox"
      - name: Desktop smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          xvfb-run --auto-servernum bun run test:desktop-smoke
      - name: Profile lifecycle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/profile-lifecycle-smoke.cjs
      - name: Marketing production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run build:marketing
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ env.F5_CI_ARTIFACT_DIR || format('{0}/ci-artifacts/{1}', runner.temp, github.job) }}
          retention-days: 7
          if-no-files-found: ignore
      - uses: ./.github/actions/assert-clean-worktree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: install
      - name: Set diagnostic paths
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          printf 'F5_CI_REPORT_DIR=%s/ci-reports/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'F5_CI_ARTIFACT_DIR=%s/ci-artifacts/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Prepare report directory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci-test-summary.ts --prepare
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          workspaces: |
            apps/desktop/native/windows -> target
            apps/desktop/native/windows/fixture -> target
      - name: Check computer tier table drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/generate-computer-tiers.ts --check
      - name: Test Windows helper
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          cargo test --locked --manifest-path apps/desktop/native/windows/Cargo.toml
      - name: Check Windows helper
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/build-computer-helper.ts --platform win --arch x64 --check
      - name: Test Windows fixture
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          cargo test --locked --manifest-path apps/desktop/native/windows/fixture/Cargo.toml
      - name: Check Windows fixture
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          cargo run --locked --manifest-path apps/desktop/native/windows/fixture/Cargo.toml -- --check
      - name: Workspace suites
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run test:ci:workspaces
      - name: Server Git smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "server-git-smoke"
        run: |
          bun run --cwd apps/server test:git:smoke
      - name: Server integration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "server-integration"
        run: |
          bun run --cwd apps/server test:integration
      - name: Build desktop
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run build:desktop
      - name: Desktop smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run test:desktop-smoke
      - name: Profile lifecycle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/profile-lifecycle-smoke.cjs
      - name: Summarize test reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci-test-summary.ts windows-build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ env.F5_CI_REPORT_DIR || format('{0}/ci-reports/{1}', runner.temp, github.job) }}
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ env.F5_CI_ARTIFACT_DIR || format('{0}/ci-artifacts/{1}', runner.temp, github.job) }}
          retention-days: 7
          if-no-files-found: ignore
      - uses: ./.github/actions/assert-clean-worktree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
  macos-profiles:
    runs-on: macos-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: install
      - name: Set diagnostic paths
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          printf 'F5_CI_REPORT_DIR=%s/ci-reports/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'F5_CI_ARTIFACT_DIR=%s/ci-artifacts/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Prepare report directory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci-test-summary.ts --prepare
      - name: Check computer tier table drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/generate-computer-tiers.ts --check
      - name: Test Swift computer helper
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          swift test --package-path apps/desktop/native/macos
      - name: Check universal computer helper
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/build-computer-helper.ts --platform mac --arch universal --check
      - name: Profile checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "macos-profiles"
        run: |
          bun run --cwd apps/server test:file src/profiles src/provider/Drivers/ClaudeHome.test.ts src/provider/Drivers/CodexHomeLayout.test.ts
      - name: Summarize test reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci-test-summary.ts macos-profiles
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ env.F5_CI_REPORT_DIR || format('{0}/ci-reports/{1}', runner.temp, github.job) }}
          retention-days: 7
          if-no-files-found: ignore
      - uses: ./.github/actions/assert-clean-worktree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
  macos-suite:
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: install
      - name: Set diagnostic paths
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          printf 'F5_CI_REPORT_DIR=%s/ci-reports/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'F5_CI_ARTIFACT_DIR=%s/ci-artifacts/%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Prepare report directory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci-test-summary.ts --prepare
      - name: Check computer tier table drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/generate-computer-tiers.ts --check
      - name: Test Swift computer helper
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          swift test --package-path apps/desktop/native/macos
      - name: Check universal computer helper
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/build-computer-helper.ts --platform mac --arch universal --check
      - name: Workspace suites
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run test:ci:workspaces
      - name: Server unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "server-unit"
        run: |
          bun run --cwd apps/server test:unit
      - name: Server Git smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "server-git-smoke"
        run: |
          bun run --cwd apps/server test:git:smoke
      - name: Server integration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "server-integration"
        run: |
          bun run --cwd apps/server test:integration
      - name: Server Git extended
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          F5_CI_SUITE_ID: "server-git-extended"
        run: |
          bun run --cwd apps/server test:git:extended
      - name: Build desktop
        # ARM64 Node defaults to a 2 GiB heap; declaration generation exceeds it.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run build:desktop
      - name: Desktop smoke
        # ARM64 Node defaults to a 2 GiB heap; declaration generation exceeds it.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run test:desktop-smoke
      - name: Profile lifecycle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/profile-lifecycle-smoke.cjs
      - name: Summarize test reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci-test-summary.ts macos-suite
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ env.F5_CI_REPORT_DIR || format('{0}/ci-reports/{1}', runner.temp, github.job) }}
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ env.F5_CI_ARTIFACT_DIR || format('{0}/ci-artifacts/{1}', runner.temp, github.job) }}
          retention-days: 7
          if-no-files-found: ignore
      - uses: ./.github/actions/assert-clean-worktree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      [
        changes,
        static,
        test,
        server-unit,
        windows-server-unit,
        browser,
        desktop,
        windows-build,
        macos-profiles,
        macos-suite,
      ]
    steps:
      - name: Require every job verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          printf '%s\n' "$NEEDS" | jq -e '
            length > 0 and all(.[]; .result == "success" or .result == "skipped")'
  main-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: ci-result
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    # A shared concurrency group can cancel pending jobs and invalidate push runs.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.ci-result.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Reconcile main status issue
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "Stale result for $GITHUB_SHA; main is $head_sha"
            exit 0
          fi
          issue="$(gh issue list --state open --label ci-main-red --json number,title --jq '[.[] | select(.title == "CI failing on main")][0].number // empty')"
          if [[ "$RESULT" == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "Green again at $GITHUB_SHA: $RUN_URL"
            fi
            exit 0
          fi
          gh label create ci-main-red --color B60205 --description 'Current main CI failure' --force
          marker="<!-- ci-main:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT -->"
          body="CI failed at $GITHUB_SHA: $RUN_URL (attempt $GITHUB_RUN_ATTEMPT). $marker"
          if [[ -z "$issue" ]]; then
            gh issue create --title 'CI failing on main' --label ci-main-red --body "$body"
          else
            comments="$(gh api --paginate "repos/$GH_REPO/issues/$issue/comments" --jq '.[].body')"
            original="$(gh issue view "$issue" --json body --jq .body)"
            if [[ "$comments" != *"$marker"* && "$original" != *"$marker"* ]]; then
              gh issue comment "$issue" --body "$body"
            fi
          fi
