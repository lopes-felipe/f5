name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Audit Codex protocol
        run: bun run protocol:audit:baseline

      - name: Run full test suite
        run: bun run test:full

  windows:
    name: Windows build and integration suite
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      # Preserve repository LF policy so this lane also detects accidental CRLF assumptions.
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run Windows unit and integration tests
        run: bun run test

      - name: Build desktop bundles
        run: bun run build:desktop

      # The hosted runner does not have real codex/cursor/grok/opencode installs.
      # Provider end-to-end spawning and authenticated Claude sessions remain a manual Windows pass.
