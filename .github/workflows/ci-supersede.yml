name: Supersede queued main CI
on:
  workflow_run:
    workflows: [CI]
    types: [requested]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Each invocation scans the current queue, so only the newest pending cleanup is needed.
concurrency:
  group: ci-queue-cleanup
  cancel-in-progress: false
jobs:
  supersede:
    if: >-
      github.repository == 'lopes-felipe/f5' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .node-version
            scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Supersede older queued CI runs
        run: node scripts/supersede-queued-ci.ts
        env:
          GH_TOKEN: ${{ github.token }}
