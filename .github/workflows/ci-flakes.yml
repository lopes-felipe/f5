name: CI flakes
# Files tests that passed only on a retry (automatic or a manual rerun) as
# `ci-flaky` issues. Runs on the default branch's code for this repository's own
# CI runs; artifacts are still parsed as data and never executed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
# No concurrency group: a pending run would cancel the previous pending one and
# drop its occurrences. Two runs filing the same new flake at once may rarely
# create a duplicate issue; losing records is worse.
jobs:
  ledger:
    # Fork PRs control their CI workflow and its artifacts; only this repository's
    # runs may publish through the ledger's issue token.
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      REPO_NAME: ${{ github.event.repository.name }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .node-version
            scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download test reports
        run: |
          # Earlier attempts' reports stay on the run; their names carry the attempt.
          if ! gh run download "$RUN_ID" --pattern 'reports-*' --dir "$RUNNER_TEMP/ci-reports"; then
            echo "::warning title=CI flake ledger::No test reports to read for run $RUN_ID"
          fi
      - name: Update flake ledger
        run: |
          node scripts/ci-flake-ledger.ts "$RUNNER_TEMP/ci-reports"
