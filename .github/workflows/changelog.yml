name: Changelog
on:
  pull_request:
    # Label changes rerun the check so adding no-changelog clears it without a push.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changelog:
    # Required check: keep this name stable and the workflow free of path filters.
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Require a changelog entry for user-visible changes
        run: node scripts/check-changelog.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
