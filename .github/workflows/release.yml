name: Release candidate
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
# Every main SHA gets its own candidate; later pushes never cancel it through this
# group. Beta candidates are cancelled only by scripts: supersede-queued-ci.ts when
# the same SHA's queued CI run is superseded, and coordinate-releases.ts once a newer
# source's CI passes. Stable builds are never cancelled.
concurrency:
  group: candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      profile: ${{ steps.plan.outputs.profile }}
      mac_matrix: ${{ steps.plan.outputs.mac_matrix }}
      windows_upgrade_matrix: ${{ steps.plan.outputs.windows_upgrade_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: plan
        run: node scripts/plan-release-candidate.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan-attempt-${{ github.run_attempt }}
          path: release-plan.json
          retention-days: 30
  windows-desktop:
    needs: preflight
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      channel: ${{ needs.preflight.outputs.channel }}
      os: windows-latest
      platform: win
      arch: x64
      target: nsis
  mac-desktop:
    # The arm64 app pins the linux-arm64 CLI archive for Linux VM profiles (see
    # release-desktop.yml), so macOS packaging waits for that one archive, not the CLI matrix.
    needs: [preflight, cli-linux-arm64]
    if: needs.preflight.outputs.profile == 'all'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.mac_matrix) }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      channel: ${{ needs.preflight.outputs.channel }}
      os: ${{ matrix.os }}
      platform: mac
      arch: ${{ matrix.arch }}
      target: dmg
  linux-desktop:
    needs: preflight
    if: needs.preflight.outputs.profile == 'all'
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      channel: ${{ needs.preflight.outputs.channel }}
      os: ubuntu-latest
      platform: linux
      arch: x64
      target: AppImage
  cli:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
    uses: ./.github/workflows/release-cli.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
  # Its own job so macOS packaging depends only on the archive it pins.
  cli-linux-arm64:
    needs: preflight
    uses: ./.github/workflows/release-cli.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      os: ubuntu-24.04-arm
      target: linux-arm64
  windows-fixtures:
    needs: [preflight, windows-desktop]
    uses: ./.github/workflows/windows-release-checks.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      channel: ${{ needs.preflight.outputs.channel }}
      bundle: windows-bundles-attempt-${{ github.run_attempt }}
  windows-published-upgrade:
    needs: [preflight, windows-desktop]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.windows_upgrade_matrix) }}
    uses: ./.github/workflows/release-published-upgrade.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      channel: ${{ needs.preflight.outputs.channel }}
      baseline: ${{ matrix.baseline }}
      baseline_channel: ${{ matrix.baselineChannel }}
      client_channel: ${{ matrix.clientChannel }}
      source_sha: ${{ github.sha }}
      artifact: desktop-win-x64-attempt-${{ github.run_attempt }}
      run_id: ${{ fromJSON(github.run_id) }}
  candidate:
    needs:
      [
        preflight,
        windows-desktop,
        mac-desktop,
        linux-desktop,
        cli,
        cli-linux-arm64,
        windows-fixtures,
        windows-published-upgrade,
      ]
    if: >-
      always() && !cancelled() &&
      needs.preflight.result == 'success' && needs.windows-desktop.result == 'success' &&
      (needs.mac-desktop.result == 'success' || needs.mac-desktop.result == 'skipped') &&
      (needs.linux-desktop.result == 'success' || needs.linux-desktop.result == 'skipped') &&
      needs.cli.result == 'success' && needs.cli-linux-arm64.result == 'success' &&
      needs.windows-fixtures.result == 'success' &&
      needs.windows-published-upgrade.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/record-release-candidate.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-attempt-${{ github.run_attempt }}
          path: candidate.json
          retention-days: 30
