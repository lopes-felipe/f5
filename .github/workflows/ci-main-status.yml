name: Main CI status
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Reruns started with GITHUB_TOKEN (ci-runner-retry.yml, the release publisher) may not raise
  # another workflow_run event, so a periodic pass reports their final result.
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  report:
    # Serialize only reporting. Retain pending results; freshness is checked
    # inside the serialized job, independently of CI/release qualification.
    concurrency:
      group: main-ci-status-reporting
      cancel-in-progress: false
      queue: max
    if: >-
      github.repository == 'lopes-felipe/f5' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # No checkout, candidate artifacts, or source-controlled code execution.
      - name: Find the newest main CI result
        id: latest
        if: github.event_name != 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$head_sha&per_page=20" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .head_repository.full_name == env.GH_REPO)][0]
              // empty | "result=\(.conclusion // "")", "sha=\(.head_sha)", "run=\(.id)", "attempt=\(.run_attempt)", "url=\(.html_url)"' \
            >> "$GITHUB_OUTPUT"
      - name: Reconcile main status issue
        if: >-
          github.event_name == 'workflow_run' ||
          steps.latest.outputs.result == 'success' || steps.latest.outputs.result == 'failure'
        env:
          RESULT: ${{ github.event.workflow_run.conclusion || steps.latest.outputs.result }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || steps.latest.outputs.sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || steps.latest.outputs.run }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt || steps.latest.outputs.attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url || steps.latest.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [[ "$head_sha" != "$SOURCE_SHA" ]]; then
            echo "Stale result for $SOURCE_SHA; main is $head_sha"
            exit 0
          fi
          attempt="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .run_attempt)"
          if [[ "$attempt" != "$SOURCE_ATTEMPT" ]]; then
            echo "Stale CI attempt"
            exit 0
          fi
          issue="$(gh issue list --state open --label ci-main-red --json number,title --jq '[.[] | select(.title == "CI failing on main")][0].number // empty')"
          if [[ "$RESULT" == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "Green again at $SOURCE_SHA: $RUN_URL"
            fi
            exit 0
          fi
          gh label create ci-main-red --color B60205 --description 'Current main CI failure' --force
          marker="<!-- ci-main:$SOURCE_RUN:$SOURCE_ATTEMPT -->"
          body="CI failed at $SOURCE_SHA: $RUN_URL (attempt $SOURCE_ATTEMPT). $marker"
          if [[ -z "$issue" ]]; then
            gh issue create --title 'CI failing on main' --label ci-main-red --body "$body"
          else
            comments="$(gh api --paginate "repos/$GH_REPO/issues/$issue/comments" --jq '.[].body')"
            original="$(gh issue view "$issue" --json body --jq .body)"
            if [[ "$comments" != *"$marker"* && "$original" != *"$marker"* ]]; then
              gh issue comment "$issue" --body "$body"
            fi
          fi
