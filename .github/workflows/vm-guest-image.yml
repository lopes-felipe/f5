name: VM guest image

# Builds the Linux VM profile guest image (apps/desktop/vm-guest). Pull requests build it
# as a check. A manual run on main with `publish` attaches it to a
# `0.0.0-guest-image-<source>` prerelease; a release pins it by copying the printed digest into
# image.lock.json. The tag must stay a semver prerelease whose channel isn't alpha or beta: the
# desktop beta updater takes the newest release in the feed whose tag has no custom channel, so
# any other tag makes every beta update check fail. It also must not start with `v`, which the
# release-tag ruleset reserves.

on:
  pull_request:
    paths:
      - "apps/desktop/vm-guest/**"
      - ".github/workflows/vm-guest-image.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the image to a guest image prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vm-guest-image-${{ github.ref }}
  # A newer push supersedes a pull request build; a manual run is never cancelled midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Runs pull request code, so it gets a read-only token and keeps no credentials.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test guest tools
        run: |
          python3 -B -m py_compile apps/desktop/vm-guest/rootfs/opt/f5/bin/f5-guest
          bash -n apps/desktop/vm-guest/rootfs/opt/f5/bin/f5-egress-apply
          bash -n apps/desktop/vm-guest/build-image.sh
          python3 -B -m unittest discover -v apps/desktop/vm-guest/tests

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables
          # With --network, QEMU needs efi-virtio.rom (ipxe-qemu) for the appliance's
          # virtio-net device, and the appliance configures it with a DHCP client that
          # supermin copies from the host; without one it has no address or resolver.
          sudo apt-get install -y --no-install-recommends libguestfs-tools qemu-utils jq \
            ipxe-qemu isc-dhcp-client dhcpcd-base
          # libguestfs reads the host kernel to build its appliance.
          sudo chmod 0644 /boot/vmlinuz-*
          # The runner's AppArmor policy stops passt; without it libguestfs uses QEMU's slirp.
          sudo apt-get remove -y passt || sudo dpkg -r --force-depends passt || true
          ! command -v passt

      - name: Test guest tools as root
        # Pipe ownership for the frame channel, and nftables accepting the egress ruleset.
        run: sudo python3 -B -m unittest discover -v apps/desktop/vm-guest/tests

      - name: Check libguestfs
        # No KVM on these runners: the same TCG setting build-image.sh selects.
        run: |
          LIBGUESTFS_BACKEND=direct LIBGUESTFS_BACKEND_SETTINGS=force_tcg \
            libguestfs-test-tool >"$RUNNER_TEMP/libguestfs-test.log" 2>&1 ||
            { tail -60 "$RUNNER_TEMP/libguestfs-test.log"; exit 1; }
          # The test tool runs without a network device; the build needs its ROM, which
          # QEMU finds through its firmware path (/usr/lib/ipxe/qemu on Ubuntu).
          dpkg -L ipxe-qemu | grep '/efi-virtio\.rom$'

      - name: Build image
        # The verbose libguestfs trace is long: keep it in a file, show its end on failure.
        run: |
          F5_IMAGE_BUILD_VERBOSE=1 apps/desktop/vm-guest/build-image.sh "$RUNNER_TEMP/vm-guest" \
            >"$RUNNER_TEMP/build-image.log" 2>&1 ||
            {
              echo "--- appliance network setup"
              grep -nE 'dhc|resolv|nameserver|iface|eth0' "$RUNNER_TEMP/build-image.log" | tail -40
              echo "--- end of log"
              tail -200 "$RUNNER_TEMP/build-image.log"
              exit 1
            }
          tail -20 "$RUNNER_TEMP/build-image.log"

      - uses: actions/upload-artifact@v4
        with:
          name: vm-guest-image
          path: ${{ runner.temp }}/vm-guest/
          retention-days: 14
          compression-level: 0

  publish:
    # Only a manual run on main publishes, so a pinned image always comes from reviewed
    # code; only this job can write to the repository.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One publish at a time, never cancelled halfway through a release upload.
    concurrency:
      group: vm-guest-image-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vm-guest-image
          path: vm-guest

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          meta=$(ls vm-guest/*.json)
          source=$(jq -r .source "$meta")
          tag="0.0.0-guest-image-$source"
          gh release create "$tag" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "VM guest image $source" \
            --notes "Linux VM profile guest image built from $GITHUB_SHA. Pin it in apps/desktop/vm-guest/image.lock.json." \
            vm-guest/*
          jq --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(jq -r .file "$meta")" \
            '{image: {url: $url, sha256, size, imageVersion, source}}' "$meta" | tee -a "$GITHUB_STEP_SUMMARY"
