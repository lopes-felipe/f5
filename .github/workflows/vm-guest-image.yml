name: VM guest image

# Builds the Linux VM profile guest image (apps/desktop/vm-guest). Pull requests build it
# as a check. A manual run with `publish` attaches it to a `vm-guest-image-<source>`
# prerelease; a release pins it by copying the printed digest into image.lock.json.

on:
  pull_request:
    paths:
      - "apps/desktop/vm-guest/**"
      - ".github/workflows/vm-guest-image.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the image to a vm-guest-image prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vm-guest-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Runs pull request code, so it gets a read-only token and keeps no credentials.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test guest tools
        run: |
          python3 -B -m py_compile apps/desktop/vm-guest/rootfs/opt/f5/bin/f5-guest
          bash -n apps/desktop/vm-guest/rootfs/opt/f5/bin/f5-egress-apply
          bash -n apps/desktop/vm-guest/build-image.sh
          python3 -B -m unittest discover -v apps/desktop/vm-guest/tests

      - name: Install image tools
        run: |
          sudo apt-get update
          # ipxe-qemu provides efi-virtio.rom, which QEMU needs for the appliance's
          # virtio-net device when virt-customize runs with --network.
          sudo apt-get install -y --no-install-recommends libguestfs-tools qemu-utils jq ipxe-qemu
          # libguestfs reads the host kernel to build its appliance.
          sudo chmod 0644 /boot/vmlinuz-*
          # The runner's AppArmor policy stops passt; without it libguestfs uses QEMU's slirp.
          sudo apt-get remove -y passt || sudo dpkg -r --force-depends passt || true
          ! command -v passt

      - name: Check libguestfs
        # No KVM on these runners: the same TCG setting build-image.sh selects.
        run: |
          LIBGUESTFS_BACKEND=direct LIBGUESTFS_BACKEND_SETTINGS=force_tcg \
            libguestfs-test-tool >"$RUNNER_TEMP/libguestfs-test.log" 2>&1 ||
            { tail -60 "$RUNNER_TEMP/libguestfs-test.log"; exit 1; }
          # The test tool runs without a network device; the build needs its ROM.
          test -e /usr/share/qemu/efi-virtio.rom || { ls -l /usr/share/qemu/; exit 1; }

      - name: Build image
        # The verbose libguestfs trace is long: keep it in a file, show its end on failure.
        run: |
          F5_IMAGE_BUILD_VERBOSE=1 apps/desktop/vm-guest/build-image.sh "$RUNNER_TEMP/vm-guest" \
            >"$RUNNER_TEMP/build-image.log" 2>&1 ||
            { tail -200 "$RUNNER_TEMP/build-image.log"; exit 1; }
          tail -20 "$RUNNER_TEMP/build-image.log"

      - uses: actions/upload-artifact@v4
        with:
          name: vm-guest-image
          path: ${{ runner.temp }}/vm-guest/
          retention-days: 14
          compression-level: 0

  publish:
    # Only a manual run publishes; only this job can write to the repository.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vm-guest-image
          path: vm-guest

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          meta=$(ls vm-guest/*.json)
          source=$(jq -r .source "$meta")
          tag="vm-guest-image-$source"
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
            --title "VM guest image $source" \
            --notes "Linux VM profile guest image built from $GITHUB_SHA. Pin it in apps/desktop/vm-guest/image.lock.json." \
            vm-guest/*
          jq --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(jq -r .file "$meta")" \
            '{image: {url: $url, sha256, size, imageVersion, source}}' "$meta" | tee -a "$GITHUB_STEP_SUMMARY"
